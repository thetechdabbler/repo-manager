site_name: repo-manager
site_description: Work safely with a directory tree of many independent Git repositories
site_url: https://thetechdabbler.github.io/repo-manager/
repo_url: https://github.com/thetechdabbler/repo-manager
repo_name: thetechdabbler/repo-manager
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: installation.md
  - Guides:
      - Daily status: guides/daily-status.md
      - Updating: guides/updating.md
      - Recovering local work: guides/recovery.md
      - Summaries: guides/summaries.md
  - Concepts:
      - Safety model: concepts/safety-model.md
      - Configuration: concepts/configuration.md
  - Reference:
      - Commands: reference/commands.md
  - Contributing: contributing.md
