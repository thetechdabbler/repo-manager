[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-manager"
version = "0.1.0"
description = "Work safely with a directory tree of many independent Git repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/thetechdabbler/repo-manager"
Repository = "https://github.com/thetechdabbler/repo-manager"
Documentation = "https://thetechdabbler.github.io/repo-manager/"
Issues = "https://github.com/thetechdabbler/repo-manager/issues"

[project.scripts]
repo-manager = "repo_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = [
    "mkdocs-material>=9.5",
    "mike>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
